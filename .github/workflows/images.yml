name: Images

# Pushes (any branch, by whoever may push here) and manual runs. Builds run on our own runners
# (scale set desktop-images) and BuildKit: a fork's pull request must never reach them, which the
# repository setting "Require approval for all external contributors" holds, whatever a fork's
# copy of this file says.
on:
  push:
  # checkov:skip=CKV_GHA_7: the input only names which published work image the VM disk is built from; only those who may push can start a run
  workflow_dispatch:
    inputs:
      work_tag:
        description: Build the VM disk from this published work image tag (e.g. 0.1.0-dev.2.gf39c26f)
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        env:
          SKIP: betterleaks # scans staged changes only: nothing to scan in CI

  work:
    name: work image
    needs: check
    runs-on: desktop-images
    # Kyber, FFmpeg and the web client build from source: long without BuildKit's cache.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 0.1.0: above the 0.0.0-dev.<run> tags built before the move to this repository.
      - name: Version
        id: version
        run: echo "version=0.1.0-dev.$GITHUB_RUN_NUMBER.g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # The runner builds nothing itself: the build goes to the lab's BuildKit, whose cache keeps
      # the Kyber and toolchain stages between runs.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Branches build without pushing.
      - name: Build, push on main
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: work/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/blizter/desktop-work:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  vm:
    name: VM disk
    needs: work
    # From a published work image only: the one main just pushed (by digest), or the tag a manual
    # run names. Its runner is privileged (mkosi partitions and mounts), in a Kata VM on the desktop
    # pool, below every session (the lab's gitops/apps/ci/runners.yaml).
    if: github.ref == 'refs/heads/main' || inputs.work_tag != ''
    runs-on: desktop-images-vm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
      ORAS_VERSION: 1.3.6
      ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
      MKOSI_COMMIT: 54c625c380ef5500f17460981a3c67b109b6a847 # v25.3
      VERSION: ${{ needs.work.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The work image downloads while the tools install: neither needs the other.
      - name: Tools, workspace and the work image's files
        env:
          IMAGE: ${{ inputs.work_tag != '' && format('ghcr.io/blizter/desktop-work:{0}', inputs.work_tag) || format('ghcr.io/blizter/desktop-work@{0}', needs.work.outputs.digest) }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends e2fsprogs >/dev/null
          # The runner's raw block volume, ext4: mkosi needs extended attributes, which Kata's
          # shared filesystem lacks.
          mkfs.ext4 -q /dev/work
          mkdir -p /work && mount /dev/work /work
          mkdir -p /work/rootfs /work/ws /work/out /work/skeleton/efi
          curl -fsSLo /tmp/crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  /tmp/crane.tgz" | sha256sum -c -
          tar -xzf /tmp/crane.tgz -C /usr/local/bin crane
          echo "$TOKEN" | crane auth login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          (crane export "$IMAGE" - | tar -x --numeric-owner -p -C /work/rootfs) &
          export_pid=$!
          # mkosi's tools, from the runner's Ubuntu instead of a tools tree it would build each run.
          apt-get install -y -qq --no-install-recommends \
            debian-archive-keyring systemd-repart systemd-ukify systemd-boot systemd-boot-efi \
            dosfstools mtools cpio zstd kmod qemu-utils python3-venv >/dev/null
          python3 -m venv /opt/mkosi
          /opt/mkosi/bin/pip install -q "git+https://github.com/systemd/mkosi@$MKOSI_COMMIT"
          curl -fsSLo /tmp/oras.tgz \
            "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  /tmp/oras.tgz" | sha256sum -c -
          tar -xzf /tmp/oras.tgz -C /usr/local/bin oras
          echo "$TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          wait "$export_pid"
      # The skeleton tree, laid down before the packages, adds /efi (the EFI partition's mount
      # point, where bootctl installs), which the container image lacks.
      - name: Build
        run: |
          /opt/mkosi/bin/mkosi -C vm --base-tree=/work/rootfs --skeleton-tree=/work/skeleton \
            --workspace-directory=/work/ws --output-directory=/work/out --force build
      # zstd on parallel writers: 11x faster than the default zlib, same size (measured 2026-11-26).
      - name: qcow2
        working-directory: /work/out
        run: |
          qemu-img convert -c -O qcow2 -o compression_type=zstd -m 8 -W desktop-work.raw disk.qcow2
          qemu-img check disk.qcow2
          qemu-img info disk.qcow2
      # The qcow2 as it is, one OCI artifact (oras pull): a container layer would gzip it again.
      - name: Push
        working-directory: /work/out
        run: |
          oras push "ghcr.io/blizter/desktop-work-vm:$VERSION" \
            --artifact-type application/vnd.blizter.desktop-vm-disk disk.qcow2:application/x-qemu-disk
