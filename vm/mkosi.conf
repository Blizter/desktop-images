# A session's VM disk: the work desktop image's own files (--base-tree: the published container
# image, unpacked) plus what a VM needs to boot: a kernel, systemd and its bootloader. Built by the
# vm job (.github/workflows/images.yml). It boots to a console: starting the desktop in a VM waits
# for the session operator's VM runtime.
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=desktop-work

[Build]
# Debian's own build tools, whatever the runner's distribution.
ToolsTree=default

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0
Packages=
        dbus
        linux-image-amd64
        systemd
        systemd-boot
        systemd-sysv
        udev
# The container image bakes in one D-Bus machine ID (dbus-uuidgen --ensure): each VM makes its own
# at first boot.
RemoveFiles=/var/lib/dbus/machine-id
