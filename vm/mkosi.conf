# A session's VM disk: the work desktop image's own files (--base-tree: the published container
# image, unpacked) plus what a VM needs to boot: a kernel, systemd and its bootloader. Built by the
# vm job (.github/workflows/images.yml). mkosi.extra/ adds what starts the desktop in it: the units
# that mount the user's home disk and run start-desktop from the settings cloud-init wrote.
[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=desktop-work

# No tools tree: building one took 4 min 44 s per run (the runner is fresh each time). The
# runner's own tools (Ubuntu 24.04, systemd 255) do the job, installed by the vm job.

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0
# cloud-init reads the session's settings from the VM runtime (mkosi.extra/etc/cloud); networkd
# and resolved (with iproute2) are what it configures the network through; e2fsprogs formats a
# new home disk.
Packages=
        cloud-init
        dbus
        e2fsprogs
        iproute2
        linux-image-amd64
        systemd
        systemd-boot
        systemd-resolved
        systemd-sysv
        udev
# The container image bakes in one D-Bus machine ID (dbus-uuidgen --ensure): each VM makes its own
# at first boot.
RemoveFiles=/var/lib/dbus/machine-id
